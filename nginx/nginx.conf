# ===================================================================
# SNIPPETIA NGINX CONFIGURATION
# ===================================================================
# 
# This configuration file sets up Nginx as a reverse proxy and load balancer
# for the Snippetia application. It handles SSL termination, static file serving,
# API routing, and implements security best practices.
#
# Features:
# - Reverse proxy for backend API services
# - Static file serving for frontend assets
# - WebSocket support for real-time features
# - Security headers and protection
# - Load balancing and health checks
# - SSL/TLS termination (when certificates are configured)
# - Rate limiting and DDoS protection
# - Compression and caching optimization
#
# Performance Optimizations:
# - Connection pooling and keep-alive
# - Gzip compression for text assets
# - Browser caching for static resources
# - Efficient worker process configuration
# ===================================================================

# Event processing configuration
events {
    # Maximum number of simultaneous connections per worker process
    # Adjust based on server capacity and expected load
    worker_connections 1024;
    
    # Use efficient connection processing method (Linux)
    use epoll;
    
    # Accept multiple connections at once
    multi_accept on;
}

# HTTP server configuration
http {
    # Backend service upstream configuration
    # Defines the pool of backend servers for load balancing
    upstream backend {
        # Backend API server (Docker service name)
        server backend:8080;
        
        # Additional backend servers can be added here for load balancing:
        # server backend2:8080;
        # server backend3:8080;
        
        # Load balancing method (default: round-robin)
        # Other options: least_conn, ip_hash, hash
    }

    # Main server block for handling all requests
    server {
        # Listen on port 80 for HTTP traffic
        # In production, this should redirect to HTTPS
        listen 80;
        
        # Server name (domain name)
        # Update this to your actual domain in production
        server_name localhost;

        # ===== SECURITY HEADERS =====
        # Prevent clickjacking attacks by controlling iframe embedding
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Prevent MIME type sniffing attacks
        add_header X-Content-Type-Options "nosniff" always;
        
        # Enable XSS protection in browsers
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Content Security Policy (CSP) for additional security
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        
        # Strict Transport Security (HSTS) - enable when using HTTPS
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ===== API ROUTES =====
        # Proxy all API requests to the backend service
        location /api/ {
            # Forward requests to the backend upstream
            proxy_pass http://backend;
            
            # Preserve original host information
            proxy_set_header Host $host;
            
            # Pass client IP address to backend
            proxy_set_header X-Real-IP $remote_addr;
            
            # Maintain forwarded IP chain for load balancers
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Preserve original protocol (HTTP/HTTPS)
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ===== WEBSOCKET SUPPORT =====
            # Enable WebSocket proxying for real-time features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # WebSocket timeout settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            # Buffer settings for better performance
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ===== HEALTH CHECK ENDPOINT =====
        # Health check endpoint for load balancers and monitoring
        location /health {
            proxy_pass http://backend/actuator/health;
            
            # Quick health check settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            # Don't cache health check responses
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ===== STATIC FILE SERVING =====
        # Serve frontend static files (HTML, CSS, JS, images)
        location / {
            # Root directory for static files
            root /usr/share/nginx/html;
            
            # Default file to serve
            index index.html;
            
            # Try to serve requested file, fallback to index.html for SPA routing
            try_files $uri $uri/ /index.html;
            
            # Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary Accept-Encoding;
            }
            
            # No caching for HTML files to ensure updates are reflected
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
        
        # ===== ADDITIONAL SECURITY LOCATIONS =====
        # Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}